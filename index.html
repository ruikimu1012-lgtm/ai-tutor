<script>
(()=>{
'use strict';
/* ---------- 基本 ---------- */
const INTERVALS=[1,3,7,14,30,60];
const LV=[['見習い',0],['使い手',60],['相談役',200],['専門家',500],['第一人者',1000]];
const CTX={A:'a-TOP',B:'副業',C:'生活'};
const COLS=['cards','tries','skills','reviews','tests','activity','terms','settings'];
const $=s=>document.querySelector(s);
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10);};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const md=d=>d? (+d.slice(5,7))+'/'+(+d.slice(8,10)) : '';
const WD='日月火水木金土';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function h(tag,p,...kids){
  const e=document.createElement(tag);
  if(p) for(const k in p){ const v=p[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k==='style') e.style.cssText=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v; else if(k==='checked'||k==='disabled') e[k]=!!v;
    else e.setAttribute(k,v===true?'':v); }
  const add=c=>{ if(c==null||c===false) return; if(Array.isArray(c)) c.forEach(add); else e.append(c instanceof Node?c:document.createTextNode(String(c))); };
  kids.forEach(add); return e;
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
function md2(text){
  const frag=document.createDocumentFragment(); let ul=null;
  const inline=s=>{ const out=[]; let last=0; const re=/\*\*[^*]+\*\*|`[^`]+`/g; let m;
    while((m=re.exec(s))){ if(m.index>last) out.push(s.slice(last,m.index)); const t=m[0]; out.push(t.startsWith('**')?h('strong',{text:t.slice(2,-2)}):h('code',{text:t.slice(1,-1)})); last=m.index+t.length; }
    if(last<s.length) out.push(s.slice(last)); return out; };
  for(const raw of String(text||'').split('\n')){ const line=raw.trimEnd();
    const li=line.match(/^\s*(?:[-*・•]|\d+[.)])\s+(.*)$/);
    if(li){ if(!ul){ ul=h('ul'); frag.append(ul);} ul.append(h('li',{},inline(li[1]))); continue; }
    ul=null; if(!line.trim()) continue;
    const hd=line.match(/^#{1,4}\s+(.*)$/);
    frag.append(hd? h('p',{},h('strong',{},inline(hd[1]))) : h('p',{},inline(line))); }
  return frag;
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました'); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;left:-9999px'; document.body.append(ta); ta.select();
  try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーできませんでした'); } ta.remove();
}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):null;
function aiUrl(base,text){ let t=String(text); while(t.length>50&&encodeURIComponent(t).length>7000) t=t.slice(0,Math.floor(t.length*0.85)); return base+encodeURIComponent(t); }
const vClass=v=>v==='今すぐ試す'?'now':v==='今月中に覚える'?'month':'skip';
const vShort=v=>v==='今すぐ試す'?'今すぐ':v==='今月中に覚える'?'今月中':v?'見送り':'—';
function steps(howto){
  if(Array.isArray(howto)) return howto.filter(Boolean);
  const s=String(howto||'').trim(); if(!s) return [];
  const parts=s.split(/\s*[①②③④⑤⑥]\s*/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1) return parts;
  const lines=s.split(/\n+/).map(x=>x.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);
  return lines.length>1? lines : [s];
}

/* ---------- 状態 ---------- */
const S={ mode:null, view:'home', params:[], briefs:[], cols:{}, sample:null, ready:false, err:'', sync:'',
  chat:[], chatBusy:false, askItem:null, flip:{}, rv:null, drafts:{}, confirm:null, showAll:false, cardPre:null, sent:new Set() };
COLS.forEach(c=>S.cols[c]={});
const list=c=>Object.entries(S.cols[c]||{}).map(([id,d])=>({...d,id}));
const doc=(c,id)=>S.cols[c]&&S.cols[c][id]? {...S.cols[c][id],id} : null;
const DEFAULT_PROFILE='・AIを仕事で使いこなす立場。Claude Code・ChatGPT・Geminiを日常的に使う\n・A. a-TOP：英会話事業のInstagram運用、リール台本づくりの自動化、社内へのAI導入の担当\n・B. 副業：中小企業向けのAI自動化、SNS投稿文の作成代行\n・C. 自分の生活：自分用の相棒AIの仕組みづくり、学び\n・難しい言葉は言い換えて、例を1つ入れてほしい';
const profile=()=> ((doc('settings','profile')||{}).text||'').trim()||DEFAULT_PROFILE;
try{ S.chat=(JSON.parse(localStorage.getItem('tutor.chat')||'[]')||[]).filter(m=>m&&m.content).slice(-30); }catch(e){}
const saveChat=()=>{ try{ localStorage.setItem('tutor.chat',JSON.stringify(S.chat.filter(m=>m.content).slice(-30))); }catch(e){} };

/* ---------- 保存先 ----------
   artifact：claude.ai のアプリのデータベース
   github  ：自分の非公開リポジトリ（db/state.json と briefs/*.json）
   local   ：この端末だけ（お試し） */
let store=null;
const b64dec=s=>{ const bin=atob(s.replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); };
const b64enc=s=>{ const u=new TextEncoder().encode(s); let bin=''; for(let i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(bin); };

function applyOp(state,op){
  state.cols=state.cols||{}; const col=state.cols[op.col]=state.cols[op.col]||{};
  if(op.op==='set') col[op.id]=op.data;
  else if(op.op==='patch') col[op.id]={...(col[op.id]||{}),...op.data};
  else if(op.op==='del') delete col[op.id];
  else if(op.op==='inc'){ const o=col[op.id]||{date:op.id,pts:0,read:[]}; const rd=o.read||[];
    if(op.key&&rd.includes(op.key)) return; col[op.id]={...o,date:o.date||op.id,pts:(o.pts||0)+op.n,read:op.key?[...rd,op.key].slice(-300):rd}; }
}
function makeQueued(name,remote){ // github / local：書き込みは手元ですぐ反映し、まとめて保存
  const KQ='tutor.'+name+'.ops', KC='tutor.'+name+'.cache';
  let base=LS.get(KC)||{state:{v:1,cols:{}},briefs:[]}; let ops=LS.get(KQ)||[]; let busy=false, timer=null, lastPut=0;
  const clone=o=>JSON.parse(JSON.stringify(o));
  const view=()=>{ const st=clone(base.state||{cols:{}}); ops.forEach(o=>applyOp(st,o)); COLS.forEach(c=>S.cols[c]=(st.cols&&st.cols[c])||{}); S.briefs=(base.briefs||[]).slice().sort((a,b)=>a.date<b.date?1:-1); };
  const persist=()=>{ LS.set(KQ,ops); LS.set(KC,base); };
  const schedule=(ms)=>{ clearTimeout(timer); timer=setTimeout(flush,ms||700); };
  async function flush(){
    if(!remote||busy||!ops.length) return; busy=true; setSync('保存中…');
    try{
      for(let i=0;i<4;i++){
        const sent=ops.slice(); const f=await remote.getState(); const st=f? f.state : {v:1,cols:{}};
        sent.forEach(o=>applyOp(st,o));
        const r=await remote.putState(st,f&&f.sha);
        if(r.conflict) continue;
        base.state=st; lastPut=Date.now(); ops=ops.slice(sent.length); persist(); view(); setSync('保存済み'); busy=false; if(ops.length) schedule(); rerender(); return;
      }
      setSync('保存待ち');
    }catch(e){ if(e.status===401){ S.err='ログインの期限が切れました。もう一度ログインしてください（未保存の分は残っています）。'; S.relogin=true; rerender(); }
      setSync(navigator.onLine===false?'オフライン（あとで保存）':'保存待ち'); }
    busy=false; schedule(15000);
  }
  const st={
    async start(){ view(); rerender(true);
      if(!remote){ S.ready=true; rerender(true); return; }
      setSync('読み込み中…');
      await st.refresh(true);
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') st.refresh(); });
      setInterval(()=>{ if(document.visibilityState==='visible'&&!busy) st.refresh(); },30*60*1000); // 開きっぱなしでも30分ごとに新しい号を読み直す
      window.addEventListener('online',()=>flush());
    },
    async refresh(first){
      try{ const [f,briefs]=await Promise.all([remote.getState(),remote.getBriefs()]);
        const fresh=f&&!busy&&Date.now()-lastPut>15000; base={state:fresh?f.state:(base.state||{v:1,cols:{}}),briefs}; persist(); view(); S.ready=true; S.err=''; setSync(ops.length?'保存待ち':'最新'); rerender(first); flush(); return true;
      }catch(e){ S.ready=true; if(e.status===401){ S.err='ログインの期限が切れました。もう一度ログインしてください。'; S.relogin=true; } else if(first) S.err='サーバーに届きませんでした。前回の内容を表示しています。'; setSync('オフライン'); rerender(first); return false; }
    },
    write(op){ if(!remote){ applyOp(base.state,op); persist(); view(); } else { ops.push(op); persist(); view(); schedule(); } rerender(true); return Promise.resolve(true); },
    seed(state,briefs){ base={state,briefs}; ops=[]; persist(); view(); }
  };
  return st;
}
function githubRemote(cfg,token){
  const api=(p,o={})=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${p}`,{cache:'no-store',...o,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json',...(o.headers||{})}});
  const fail=r=>{ const e=new Error('github '+r.status); e.status=r.status; throw e; };
  const briefCache=LS.get('tutor.github.bsha')||{};
  return {
    async getState(){ const r=await api('contents/db/state.json?ref=main&t='+Date.now()); if(r.status===404) return null; if(!r.ok) fail(r); const j=await r.json(); let c=j.content;
      if(!c&&j.size>0&&j.git_url){ const b=await fetch(j.git_url,{cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}}); if(!b.ok) fail(b); c=(await b.json()).content; }
      return {sha:j.sha,state:JSON.parse(b64dec(c))}; },
    async putState(st,sha){ const body={message:'app '+today(),content:b64enc(JSON.stringify(st)),branch:'main'}; if(sha) body.sha=sha;
      const r=await api('contents/db/state.json',{method:'PUT',body:JSON.stringify(body)}); if(r.status===409||r.status===422) return {conflict:true}; if(!r.ok) fail(r); return {ok:true}; },
    async getFile(path){ const r=await api('contents/'+path+'?ref=main&t='+Date.now()); if(r.status===404) return null; if(!r.ok) fail(r); const j=await r.json(); return JSON.parse(b64dec(j.content)); },
    async putFile(path,obj){ const r=await api('contents/'+path,{method:'PUT',body:JSON.stringify({message:'ask',content:b64enc(JSON.stringify(obj)),branch:'main'})}); if(!r.ok) fail(r); return true; },
    async getBriefs(){ const r=await api('contents/briefs?ref=main&t='+Date.now()); if(r.status===404) return []; if(!r.ok) fail(r);
      const files=(await r.json()).filter(f=>/^\d{4}-\d{2}-\d{2}\.json$/.test(f.name)).sort((a,b)=>a.name<b.name?1:-1).slice(0,40);
      const got=await Promise.all(files.map(async f=>{ const c=briefCache[f.name]; if(c&&c.sha===f.sha) return c.data;
        const x=await api('contents/'+f.path+'?ref=main'); if(!x.ok) return null; const j=await x.json();
        try{ const data=JSON.parse(b64dec(j.content)); briefCache[f.name]={sha:f.sha,data}; return data; }catch(e){ return null; } }));
      const keep={}; files.forEach(f=>{ if(briefCache[f.name]) keep[f.name]=briefCache[f.name]; }); LS.set('tutor.github.bsha',keep);
      return got.filter(Boolean); }
  };
}
function artifactStore(db){
  return {
    start(){
      const timer=setTimeout(()=>{ if(!S.ready){ S.err='読み込みに時間がかかっています。開き直してください。'; rerender(); } },10000);
      const fail=e=>{ clearTimeout(timer); S.err= e&&e.code==='revoked'?'この画面への接続が切れました。':'記録を読み込めませんでした。開き直してください。'; rerender(); };
      let pending=COLS.length+1;
      const done=s=>{ if(!s.metadata||!s.metadata.fromCache){ if(--pending<=0&&!S.ready){ S.ready=true; clearTimeout(timer); } } };
      db.collection('briefs').orderBy('date','desc').limit(40).onSnapshot(s=>{ S.briefs=s.docs.map(d=>({...d.data(),date:d.data().date||d.id})); done(s); rerender(); },fail);
      COLS.forEach(c=>db.collection(c).onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.cols[c]=o; done(s); rerender(); },fail));
    },
    async write(op){ const ref=db.doc(op.col+'/'+op.id);
      try{ if(op.op==='set') await ref.set(op.data); else if(op.op==='patch') await ref.set({...(S.cols[op.col][op.id]||{}),...op.data}); else await ref.delete();
        rerender(true); return true;
      }catch(e){ toast(e&&e.code==='not_granted'?'書き込みの許可がありません':'保存できませんでした。もう一度試してください'); return false; } }
  };
}

/* ---------- 合言葉で鍵を開ける（openssl enc -aes-256-cbc -pbkdf2 -iter 310000 -md sha256 と同じ形式）---------- */
async function openVault(b64,pass){
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(new TextDecoder().decode(raw.slice(0,8))!=='Salted__') throw new Error('bad vault');
  const salt=raw.slice(8,16), ct=raw.slice(16);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct));
}

/* ---------- アプリの中のAI（サイト版）：Gemini の無料枠。キーは自分の非公開の保管庫に置く ---------- */
function geminiSample(key){
  const API='https://generativelanguage.googleapis.com/v1beta';
  const err=(code,msg)=>{ const e=new Error(msg||code); e.code=code; return e; };
  async function models(){
    const c=LS.get('tutor.gmodels'); if(c&&c.key===key.slice(-6)&&Date.now()-c.t<864e5&&c.list.length) return c.list;
    const r=await fetch(`${API}/models?pageSize=200&key=${encodeURIComponent(key)}`); if(r.status===400||r.status===403) throw err('bad_key');
    const j=await r.json();
    const ver=n=>{ const m=n.match(/gemini-(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):0; };
    const list=(j.models||[]).map(m=>m.name.replace('models/','')).filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/image|tts|audio|live|embedding|exp|preview|thinking/.test(n))
      .sort((a,b)=> (/lite/.test(a)-/lite/.test(b)) || ver(b)-ver(a));
    if(!list.length) (j.models||[]).forEach(m=>{ const n=m.name.replace('models/',''); if(/flash/.test(n)&&(m.supportedGenerationMethods||[]).includes('generateContent')) list.push(n); });
    LS.set('tutor.gmodels',{key:key.slice(-6),t:Date.now(),list}); return list;
  }
  const toContents=msgs=>msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  async function call(contents,onText,jsonMode){
    const list=await models(); if(!list.length) throw err('no_model');
    const skip=LS.get('tutor.gskip')||{}; const day=today();
    for(const model of list){
      if(skip[model]===day) continue;
      const body={contents,generationConfig:jsonMode?{responseMimeType:'application/json'}:{}};
      const r=await fetch(`${API}/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
      if(r.status===429||r.status===404||r.status===403&&!/API key/.test(await r.clone().text())){ skip[model]=day; LS.set('tutor.gskip',skip); continue; }
      if(r.status===400||r.status===403) throw err('bad_key');
      if(!r.ok) throw err('failed');
      const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', text='';
      for(;;){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true});
        let i; while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
          if(!line.startsWith('data:')) continue; try{ const j=JSON.parse(line.slice(5)); const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join(''); if(t){ text+=t; onText&&onText({text}); } }catch(e){} } }
      return {text,model};
    }
    throw err('rate_limited');
  }
  const sample=async(msgs,o={})=>call(toContents(msgs),o.onText,false);
  sample.json=async(prompt)=>{ const r=await call([{role:'user',parts:[{text:prompt}]}],null,true); return JSON.parse(r.text.replace(/^```(json)?|```$/g,'').trim()); };
  sample.gemini=true; return sample;
}
/* Macの Claude（Max契約の Claude Code）に答えてもらう：asks/<id>.json に置く → Macが answers/<id>.json に答えを置く */
function macSample(remote){
  const err=c=>{ const e=new Error(c); e.code=c; return e; };
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function ask(payload,onText){
    const id=uid(), t0=Date.now(); let seen=false;
    onText&&onText({text:'Macに届けています…'});
    await remote.putFile(`asks/${id}.json`,{id,createdAt:new Date().toISOString(),...payload});
    for(;;){
      await wait(3000); const sec=Math.round((Date.now()-t0)/1000);
      let r=null; try{ r=await remote.getFile(`answers/${id}.json`); }catch(e){}
      if(r&&r.status==='done') return r;
      if(r&&r.status==='error') throw err('failed');
      if(r) seen=true;
      if(!seen&&sec>75) throw err('mac_offline');
      if(sec>480) throw err('timeout');
      onText&&onText({text:`${seen?'MacのClaudeが考えています':'Macに届けています'}…（${sec}秒）`});
    }
  }
  const sample=async(msgs,o={})=>{ const r=await ask({kind:'chat',messages:msgs},o.onText); return {text:r.text}; };
  sample.json=async(prompt)=>{ const r=await ask({kind:'json',prompt}); return JSON.parse(r.text.replace(/^```(json)?|```$/g,'').trim()); };
  sample.mac=true; return sample;
}

        h('div',{class:'row'}, ki, h('button',{class:'btn sm',onclick:async()=>{ const v=ki.value.trim(); if(!/^AIza[\w-]{20,}$/.test(v)) return toast('キーの形がちがうようです'); LS.del('tutor.gpause'); LS.del('tutor.gskip'); LS.del('tutor.gmodels'); if(await put('settings','gemini',{key:v,updatedAt:today()},'保存しました')) ki.value=''; },text:gk?'差し替える':'保存する'}),
          gk? h('button',{class:'btn sm ghost',onclick:()=>put('settings','gemini',{key:'',updatedAt:today()},'外しました'),text:'外す'}) : null)) : null));
  }
  wrap.append(h('div',{class:'grid g2'}, left, right));
  if(sub==='tries'&&S.scrollTries) setTimeout(()=>{ const el=document.getElementById('tries'); if(el) el.scrollIntoView({behavior:'smooth'}); },80);
  return wrap;
}

/* ---------- ログイン（サイト版）---------- */
function loginView(){
  const pw=h('input',{type:'password',placeholder:'合言葉',autocomplete:'current-password','aria-label':'合言葉'});
  const msg=h('p',{class:'small',style:'min-height:1.5em'});
  return h('div',{class:'login'}, h('div',{class:'card rise'},
    h('h1',{class:'hero-t',style:'font-size:30px',text:'おかえりなさい。'}),
    h('p',{class:'muted',text:'合言葉を入れると、この端末では次から自動でひらきます。'}),
    h('form',{class:'stack',onsubmit:async e=>{ e.preventDefault(); msg.textContent='確かめています…'; const ok=await tryLogin(pw.value.trim()); if(!ok){ msg.textContent='合言葉がちがうようです。'; pw.select(); } }}, pw, msg, h('button',{class:'btn pri block',type:'submit',text:'ひらく'}))));
}
async function tryLogin(pass){
  try{ const tok=(await openVault(window.TUTOR_CONFIG.vault,pass)).trim(); if(!/^(gh[opsu]_|github_pat_)/.test(tok)) return false; LS.set('tutor.token',tok); startGithub(tok); return true; }catch(e){ return false; }
}
function logout(){ LS.del('tutor.token'); location.hash='#/home'; location.reload(); } // 未保存の分（ops）と表示用の控えは残す。次にログインした時に送られる
function startGithub(tok){
  S.mode='github'; S.err=''; S.relogin=false;
  S.remote=githubRemote(window.TUTOR_CONFIG,tok); store=makeQueued('github',S.remote); store.start();
}

/* ---------- 起動 ---------- */
async function boot(){
  const th=LS.get('tutor.theme'); if(th) document.documentElement.setAttribute('data-theme',th);
  window.addEventListener('hashchange',route);
  if(window.TUTOR_CONFIG){
    const m=location.hash.match(/login=([^&]+)/);
    if(m){ history.replaceState(null,'',location.pathname+'#/home'); }
    route();
    if(m && await tryLogin(decodeURIComponent(m[1]))) return;
    const tok=LS.get('tutor.token'); if(tok){ startGithub(tok); return; }
    S.mode='login'; render(); return;
  }
  route();
  if(window.claude){
    const [db,sample]=await Promise.all([claude.use('db'),claude.use('sample')]);
    S.sample=sample||null;
    if(!db){ S.mode='artifact'; S.err='この表示では記録を読めません。claude.ai にサインインしているか確かめてください。'; render(); return; }
    S.mode='artifact'; store=artifactStore(db); store.start(); render(); return;
  }
  S.mode='local'; store=makeQueued('local',null);
  if(window.TUTOR_SEED&&!LS.get('tutor.local.cache')) store.seed(window.TUTOR_SEED.state,window.TUTOR_SEED.briefs);
  store.start();
}
boot();
})();
</script>
